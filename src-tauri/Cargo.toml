[package]
name = "apply-tool"
version = "0.1.0"
edition = "2021"

[lib]
name = "apply_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "time"] }
regex = "1"
dirs = "6"
base64 = "0.22"
typst = "0.15.1"
typst-render = "0.15.1"
typst-layout = "0.15.1"
comemo = "0.5.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts", "embedded-fonts", "datetime"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
custom-protocol = ["tauri/custom-protocol"]
